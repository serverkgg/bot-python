name: اقتراح / Suggestion
description: فكرة تحسّن الحزمة: طريقة تشغيل، أو مدير حزم، أو قالب جديد / An idea that improves the package: a start method, a package manager or a new template
labels:
  - suggestion
body:
  - type: textarea
    id: idea
    attributes:
      label: ما الفكرة؟ / What is the idea?
      description: اشرح الاقتراح وفائدته لأصحاب البوتات / Explain the suggestion and why bot owners benefit
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: البدائل / Alternatives
      description: هل جربت حلًا آخر للحاجة نفسها؟ / Anything else that solves the same need?
    validations:
      required: false
