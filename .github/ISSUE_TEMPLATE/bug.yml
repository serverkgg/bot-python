name: مشكلة / Bug report
description: شيء خربان في تشغيل بوتك أو في الحزمة نفسها / Something broken in running your bot or in the package itself
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: وش صار؟ / What happened?
      description: اشرح المشكلة، ولو تقدر أرفق سطور الكونسول أو صورة / Describe the problem, attach console lines or screenshots if you can
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: وش كنت متوقع؟ / What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: خطوات التكرار / Steps to reproduce
      description: كيف نوصل لنفس المشكلة؟ / How do we hit the same problem?
    validations:
      required: false
  - type: input
    id: bot-setup
    attributes:
      label: المنصة والمكتبة / Platform and library
      placeholder: discord.py 2, python-telegram-bot 21...
    validations:
      required: false
